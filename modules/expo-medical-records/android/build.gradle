plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.medicalrecords'
version = '0.1.0'

android {
  namespace "expo.modules.medicalrecords"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.health.connect:health-connect-client:1.1.0-alpha07"
}
